# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "7bc495cef52d80d38b17f5f420dc57c3"
name = "Smart Upsell"
application_url = "https://upsell.dreamzapps.com"
embedded = true

[build]
# Do not rewrite the live public app to the Cloudflare tunnel.
# Dev preview uses /extensions on the tunnel; production needs deploy.
# Use `pnpm run deploy` (not bare `shopify app deploy`) so cart-upsell JS is minified under 10KB first.
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/gdpr"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customer_events,read_orders,read_pixels,write_pixels,write_products"

[auth]
redirect_urls = [ "https://upsell.dreamzapps.com/api/auth" ]

[app_proxy]
url = "https://upsell.dreamzapps.com"
subpath = "checkout-upsell"
prefix = "apps"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"
