packages:
  - 'extensions/*'
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@graphql-tools/github-loader@9.1.13'
  - '@graphql-tools/graphql-tag-pluck@8.3.41'
  - '@graphql-tools/utils@12.1.0'
