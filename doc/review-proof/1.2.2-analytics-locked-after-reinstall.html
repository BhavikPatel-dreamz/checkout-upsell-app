<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Analytics locked after reinstall</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f2f4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .shell { display: flex; min-height: 100vh; }
    .nav {
      width: 240px;
      background: #fff;
      border-right: 1px solid #e4e8ec;
      padding: 16px 12px;
    }
    .nav h3 { margin: 0 12px 16px; font-size: 13px; color: #6d7175; font-weight: 650; }
    .nav a {
      display: block;
      padding: 8px 12px;
      border-radius: 8px;
      color: #202223;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 2px;
    }
    .nav a.active { background: #f1f2f4; font-weight: 650; }
    .main { flex: 1; background: #f6f6f7; position: relative; overflow: hidden; }
    .blur {
      filter: blur(7px);
      padding: 28px 24px;
      pointer-events: none;
    }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .kpi { background: #fff; border: 1px solid #e4e8ec; border-radius: 12px; padding: 16px; height: 88px; }
    .chart { margin-top: 16px; background: #fff; border: 1px solid #e4e8ec; border-radius: 12px; height: 280px; }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 140px;
    }
    .card {
      background: #fff;
      border: 1px solid #e4e8ec;
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
      padding: 28px 32px;
      max-width: 420px;
      text-align: center;
    }
    .card h2 { margin: 0 0 8px; font-size: 20px; }
    .card p { margin: 0 0 16px; color: #6d7175; }
    .btn {
      display: inline-block;
      background: #008060;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="nav">
      <h3>Dynamic Dreamz Upsell</h3>
      <a>Dashboard</a>
      <a>Create Upsell</a>
      <a>All Upsells</a>
      <a>Product Sync</a>
      <a class="active">Analytics</a>
      <a>Subscription</a>
      <a>Settings</a>
      <a>Onboarding</a>
    </aside>
    <div class="main">
      <div class="blur" aria-hidden="true">
        <div class="kpis">
          <div class="kpi"></div>
          <div class="kpi"></div>
          <div class="kpi"></div>
          <div class="kpi"></div>
        </div>
        <div class="chart"></div>
      </div>
      <div class="overlay">
        <div class="card">
          <h2>Upgrade for the full report</h2>
          <p>Analytics is not included on the Free plan. Silver includes the full report.</p>
          <a class="btn" href="#">View plans</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
