name: Deploy checkout-upsell-app

on:
  push:
    branches: [main]

env:
  VPS_APP_PATH: "/var/www/html/checkout-upsell-app"
  PM2_PROCESS_NAME: "checkout-upsell-app"

jobs:
  # 1. Validate on GitHub's own runner FIRST — nothing on the server is touched yet.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  # 2. Only runs if validate succeeded. Deploys + builds again on the VPS itself,
  #    since the validate job's build artifacts aren't on the server.
  deploy:
    needs: validate
    runs-on: [self-hosted]
    steps:
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Sync Code
        run: |
          if [ -d "${{ env.VPS_APP_PATH }}/.git" ]; then
              cd "${{ env.VPS_APP_PATH }}"
              git fetch origin
              git reset --hard "origin/main"
              git clean -fd
          else
              git clone -b main git@github.com:BhavikPatel-dreamz/checkout-upsell-app.git "${{ env.VPS_APP_PATH }}"
          fi

      - name: Build on server
        run: |
          cd "${{ env.VPS_APP_PATH }}"
          # Leftover npm installs on a pnpm node_modules tree crash with:
          # Cannot read properties of null (reading 'edgesOut')
          rm -rf node_modules
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Start App
        run: |
          cd "${{ env.VPS_APP_PATH }}"
          if pm2 list | grep -q "${{ env.PM2_PROCESS_NAME }}"; then
              pm2 restart "${{ env.PM2_PROCESS_NAME }}"
          else
              pm2 start pnpm --name "${{ env.PM2_PROCESS_NAME }}" -- start
          fi
          pm2 save
